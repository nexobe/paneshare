name: CI

# Builds and tests every push to main and every pull request. Releases are not made here: they are
# signed and notarized on the release Mac with scripts/ship.sh, so no signing key is stored in GitHub
# (docs/RELEASING.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (core tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test

  macos:
    name: macOS ${{ matrix.os }} (build all, test core, bundle)
    strategy:
      fail-fast: false
      matrix:
        # GitHub retired the macos-14 runner image ("configuration 'macos-14-arm64-us-default' is not supported").
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: scripts/make-app.sh debug
      - name: Upload the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'macos-15'
        with:
          name: paneshare-unsigned-${{ github.sha }}
          path: build/app.noindex/paneshare.app
          retention-days: 7
