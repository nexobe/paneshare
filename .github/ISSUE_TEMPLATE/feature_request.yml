name: Feature request
description: Suggest something paneshare should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the solution. What's hard about it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I checked the Roadmap and Known risks in the README.
          required: true
